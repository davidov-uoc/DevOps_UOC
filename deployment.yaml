apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-web-uoc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-uoc
  template:
    metadata:
      labels:
        app: web-uoc
    spec:
      containers:
      - name: nginx-container
        image: mi-web-uoc:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
